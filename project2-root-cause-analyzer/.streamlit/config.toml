# CAUSE midnight-blue theme.
#
# Streamlit reads this file from the folder next to app_root_cause.py and it
# takes precedence over the repository root's .streamlit/config.toml, so the
# dark theme applies whether the app is launched from this folder or from
# the repository root.

[theme]
base = "dark"
primaryColor = "#4F8CFF"
backgroundColor = "#080F20"
secondaryBackgroundColor = "#142440"
textColor = "#F1F5F9"
borderColor = "#253B5B"
showWidgetBorder = true
linkColor = "#7FAEFF"
font = "sans-serif"
baseRadius = "10px"
dataframeHeaderBackgroundColor = "#0D1930"
dataframeHeaderTextColor = "#94A3B8"
dataframeBorderColor = "#253B5B"
greenColor = "#34D399"
redColor = "#FB7185"
blueColor = "#4F8CFF"
chartCategoricalColors = ["#4F8CFF", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]

[theme.sidebar]
backgroundColor = "#0D1930"
secondaryBackgroundColor = "#142440"
borderColor = "#253B5B"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
